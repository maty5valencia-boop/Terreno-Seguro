<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Prevención</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--azul:#23306b;--azul2:#3b4fa8;--fondo:#f2f4f9;--card:#fff;--texto:#18203a;--muted:#667089;--borde:#dde2ee;
--ok:#1e8e4f;--okbg:#e3f5ea;--mal:#c62828;--malbg:#fde7e7;--warn:#b26a00;--warnbg:#fff3dc;--sel:#e4e8fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo:#11141d;--card:#1b2030;--texto:#e8ebf4;--muted:#9aa3ba;--borde:#2c3348;--okbg:#14301f;--malbg:#3a1717;--warnbg:#382a10;--sel:#252d4a;--azul2:#8d9cf5}}
:root[data-theme="dark"]{--fondo:#11141d;--card:#1b2030;--texto:#e8ebf4;--muted:#9aa3ba;--borde:#2c3348;--okbg:#14301f;--malbg:#3a1717;--warnbg:#382a10;--sel:#252d4a;--azul2:#8d9cf5}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--azul2)}
header.top{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top .logo img{width:100%;height:100%;object-fit:cover;display:block}.logo{overflow:hidden;width:34px;height:34px;border-radius:9px;background:#fff;color:var(--azul);display:grid;place-items:center;font-weight:800}
header.top b{font-size:16px}header.top .sp{flex:1}
header.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
nav{display:flex;gap:4px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--borde);overflow-x:auto}
nav button{border:0;background:none;padding:9px 14px;border-radius:9px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--sel);color:var(--azul2)}
main{padding:16px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.bar label{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--card);color:var(--texto)}
textarea{min-height:70px;width:100%}
.btn{border:1px solid var(--borde);background:var(--card);color:var(--texto);border-radius:8px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn.primary{background:var(--azul);border-color:var(--azul);color:#fff}.btn.sm{padding:4px 9px;font-size:13px}.btn.del{color:var(--mal)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;background:var(--card)}
table.t th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:2px solid var(--borde);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--borde);vertical-align:top}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--sel)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--borde);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.mal{background:var(--malbg);color:var(--mal)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.azul{background:var(--sel);color:var(--azul2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:14px}.kpi b{display:block;font-size:28px}.kpi span{color:var(--muted);font-size:13px}
.kpi.mal b{color:var(--mal)}
.barras .b{display:grid;grid-template-columns:minmax(120px,240px) 1fr 40px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.barras .b i{display:block;height:14px;background:var(--azul2);border-radius:4px}.barras .b.mal i{background:var(--mal)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
#mapa{height:560px;border-radius:12px;border:1px solid var(--borde)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;justify-content:center;align-items:flex-start;padding:30px 12px;z-index:1000;overflow:auto}
.modal{background:var(--card);border-radius:14px;max-width:820px;width:100%;padding:18px}
.modal h3{margin:0 0 12px}.modal .pie{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.fg label.full{grid-column:1/-1}
.det .s{background:var(--sel);font-weight:700;padding:6px 8px;border-radius:6px;margin-top:10px}
.det .r{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 8px;border-bottom:1px solid var(--borde)}
.det .r.al{background:var(--malbg);color:var(--mal)}
.ed-layout{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media (max-width:820px){.ed-layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
.flist button{display:block;width:100%;text-align:left;border:1px solid var(--borde);background:var(--card);color:var(--texto);padding:9px 10px;border-radius:9px;margin-bottom:6px;font:inherit;cursor:pointer}
.flist button.on{border-color:var(--azul2);background:var(--sel)}
.sec-ed{border:1px solid var(--borde);border-radius:10px;padding:10px;margin-bottom:12px}
.sec-ed .h{display:flex;gap:6px;align-items:center;margin-bottom:8px}.sec-ed .h input{flex:1;font-weight:700}
.it-ed{display:grid;grid-template-columns:1fr 120px 92px 70px 58px auto;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--borde)}
.it-ed .op{grid-column:1/-1}
.it-ed label{font-size:12px;display:flex;align-items:center;gap:3px;white-space:nowrap}
@media (max-width:820px){.it-ed{grid-template-columns:1fr 1fr}}
.matriz td,.matriz th{text-align:center;font-size:12px;padding:4px 6px!important}.matriz td:first-child,.matriz th:first-child{text-align:left;white-space:nowrap}
.matriz .si{color:var(--ok);font-weight:700}.matriz .no{color:#fff;background:var(--mal)!important;font-weight:700}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
#toast{position:fixed;right:16px;bottom:16px;background:#18203a;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:2000;max-width:420px}
.muted{color:var(--muted)}
[hidden]{display:none!important}
.pad canvas{width:100%;height:170px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;display:block}
.uvchip{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px;color:#fff}

.shell{display:flex;min-height:100vh}
.sb{width:238px;flex:none;background:var(--azul);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:20}
.sb .brand{display:flex;gap:12px;align-items:center;padding:16px 14px 12px;color:#fff}.sb .brand .logo{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.3)}.sb .logo img{width:100%;height:100%;object-fit:cover;display:block}.sb .brand b{display:block;font-size:14.5px}.sb .brand small{color:#dfe3f3;font-size:11.5px}
.sb .bus{margin:2px 10px 8px;background:rgba(255,255,255,.12);border:1px solid transparent;border-radius:9px;padding:8px 10px;display:flex;gap:8px;align-items:center;color:#e8ebf7;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.sb .bus:hover{background:rgba(255,255,255,.18)}.sb .bus kbd{margin-left:auto;font:11px system-ui;background:rgba(255,255,255,.15);border-radius:5px;padding:1px 6px;color:#fff}
.snav{flex:1;overflow-y:auto;padding:0 8px 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.gh{width:100%;display:flex;justify-content:space-between;align-items:center;font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c3c9e4;padding:11px 10px 4px;background:none;border:0;cursor:pointer;text-align:left}
.gh.fijo{cursor:default}.gh span{font-size:10px;letter-spacing:0;display:flex;align-items:center}
.si{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border-radius:8px;border:0;background:none;color:#fff;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;position:relative}
.si:hover{background:rgba(255,255,255,.1)}.si.on{background:#fff;color:var(--azul);font-weight:700}
.si svg{flex:none}.si .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .st{opacity:0;font-size:13px;color:#f5c542;width:14px;text-align:center}.si:hover .st{opacity:.8}.si .st.f{opacity:1}.si.on .st{color:#d98a00}
.bd{font-style:normal;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px;color:#fff;background:#4a63d8}.bd.r{background:#e5484d}.bd.a{background:#d98a00}
.sb .me{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.14);color:#fff}
.av{width:32px;height:32px;border-radius:50%;background:#4a63d8;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;color:#fff}
.sb .me .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}.sb .me small{display:block;color:#dfe3f3;font-size:11.5px}
.sb .me button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:7px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}.sb .me button:first-of-type{margin-left:auto}.sb .me .tema{display:grid;place-items:center;padding:5px 6px}
.sb.claro{background:var(--card);color:var(--texto);border-right:1px solid var(--borde)}.sb.claro .brand{color:var(--texto)}.sb.claro .brand b{color:var(--azul)}.sb.claro .brand small,.sb.claro .me small{color:var(--muted)}
.sb.claro .brand .logo{box-shadow:0 0 0 1px var(--borde),0 2px 6px rgba(0,0,0,.12)}
.sb.claro .bus{background:var(--fondo);border-color:var(--borde);color:var(--muted)}.sb.claro .bus kbd{background:var(--card);border:1px solid var(--borde);color:var(--muted)}
.sb.claro .snav{scrollbar-color:var(--borde) transparent}.sb.claro .gh{color:var(--muted)}
.sb.claro .si{color:var(--texto)}.sb.claro .si svg{opacity:.75}.sb.claro .si:hover{background:var(--fondo)}.sb.claro .si.on{background:var(--sel);color:var(--azul2)}.sb.claro .si.on svg{opacity:1}
.sb.claro .si.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--azul2)}.sb.claro .si .st{color:#d98a00}
.sb.claro .me{border-top-color:var(--borde);color:var(--texto)}.sb.claro .me button{background:var(--fondo);border:1px solid var(--borde);color:var(--texto)}.sb.claro .av{background:var(--azul)}
.cont{flex:1;min-width:0}header.top.mob{display:none}.tabbar{display:none}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:10.5px;font-weight:600;color:var(--muted);position:relative;cursor:pointer;padding:4px 0}
.tabbar button.on{color:var(--azul2)}.tabbar .bd{position:absolute;top:-1px;left:calc(50% + 3px);font-size:9.5px;padding:0 5px;line-height:15px}
@media (max-width:820px){.sb{display:none}header.top.mob{display:flex;position:sticky;top:0;z-index:20}header.top.mob .logo{width:40px;height:40px;border-radius:50%}header.top.mob button{display:grid;place-items:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--borde);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}main{padding-bottom:84px}}
.hoja-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:60;display:flex;align-items:flex-end}
.hoja{background:var(--card);color:var(--texto);width:100%;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.hoja .grab{width:40px;height:4px;border-radius:3px;background:var(--borde);margin:0 auto 10px}
.hgt{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
.hg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.hg button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:11px;font-weight:600;color:var(--texto);cursor:pointer;position:relative;text-align:center}
.hg i{width:46px;height:46px;border-radius:13px;background:var(--sel);display:grid;place-items:center;color:var(--azul2)}.hg .bd{position:absolute;top:-4px;right:8px;font-size:9.5px;padding:0 5px;line-height:16px}
.bus-m{max-width:560px;padding:0;overflow:hidden;align-self:flex-start;margin-top:10vh}.bus-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--borde);color:var(--muted)}
.bus-in input{flex:1;border:0;padding:6px 0;font-size:16px;background:none;outline:none}.bus-in kbd{font:11px system-ui;border:1px solid var(--borde);border-radius:5px;padding:1px 6px}
#busR{max-height:55vh;overflow:auto;padding:6px}.bus-r{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;font:inherit;color:var(--texto);cursor:pointer;text-align:left}
.bus-r svg{color:var(--azul2);flex:none}.bus-r b{display:block;font-weight:600}.bus-r small{color:var(--muted)}.bus-r.on,.bus-r:hover{background:var(--sel)}
body.bg .sb{background:rgba(20,30,90,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}body.bg .sb.claro{background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.bg{background:#0a1030}
body.bg::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,10,40,.35),rgba(6,10,40,.8)),var(--fondo-img) center/cover no-repeat}
body.bg header.top{background:rgba(20,30,90,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.bg nav{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.bg main>p,body.bg main>.muted,body.bg main>h3,body.bg main>.bar>label,body.bg main>.bar>span{color:#dfe5fb}
.cal{display:grid;gap:6px;min-width:980px}.cal .h{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;padding:4px}
.cal .h.hoy{color:var(--azul2)}.cal .who{font-weight:700;font-size:13px;padding:8px 4px}
.cal .cel{background:var(--card);border:1px solid var(--borde);border-radius:9px;min-height:74px;padding:4px;display:flex;flex-direction:column;gap:4px}
.cal .cel.hoy{border-color:var(--azul2);box-shadow:inset 0 0 0 1px var(--azul2)}.cal .cel.drop{background:var(--sel)}
.cal .cel .mas{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;text-align:left;padding:2px 4px;margin-top:auto}.cal .cel .mas:hover{color:var(--azul2)}
.tk{font-size:12px;line-height:1.3;border-radius:7px;padding:4px 6px;background:var(--sel);border-left:4px solid var(--azul2);cursor:pointer}
.tk.urg{border-left-color:var(--mal)}.tk.baja{border-left-color:var(--muted)}.tk.cer{opacity:.5;text-decoration:line-through}.tk.atr{background:var(--malbg)}
.tk b{display:block}
.persona{display:grid;grid-template-columns:1fr auto;gap:6px;padding:9px 0;border-top:1px solid var(--borde);align-items:center}
.persona:first-child{border-top:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fechaHoy{margin:0;flex:1;text-transform:capitalize;color:var(--texto)}body.bg .fechaHoy{color:#fff}
.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--azul2)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--borde);color:var(--muted)}.vrow strong{color:var(--texto);text-align:right}
.carga{padding:70px 0;text-align:center;color:var(--muted);font-size:15px}.cargalogo{position:relative;width:96px;height:96px;margin:0 auto 14px}.cargalogo img{position:absolute;inset:5px;width:86px;height:86px;border-radius:50%;object-fit:cover}.cargalogo i{position:absolute;inset:0;border:4px solid rgba(255,255,255,.35);border-top-color:#F28C28;border-radius:50%;animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}.carga-msg{transition:opacity .3s;display:inline-block;background:rgba(18,26,61,.85);color:#fff;font-weight:600;font-size:16px;padding:8px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
<style>
.btn[onclick="editarTicket()"].primary,#cNt{background:#fff;color:var(--azul);border-color:#fff}.btn[onclick="editarTicket()"].primary:hover,#cNt:hover{background:var(--azul);border-color:var(--azul);color:#fff}
.btn:not(.primary):not(.del):not(:disabled):hover{background:var(--azul);border-color:var(--azul);color:#fff}.btn{transition:background .15s,color .15s,border-color .15s}
</style>
<style id="acento">
/* Color de acento de la empresa (el servidor lo cambia según Configuración) */
.sb .si.on{box-shadow:inset 4px 0 0 #F28C28}.sb .si.on svg{color:#F28C28}.sb .gh{color:#ffb070}.sb .bus kbd{background:#F28C28;color:#fff}.sb .brand .logo{box-shadow:0 0 0 2px #F28C28}
.btn.primary{background:#F28C28;border-color:#F28C28;color:#fff}.btn.primary:hover{filter:brightness(1.05)}
.kpi{border-top:3px solid #F28C28}.card h3{border-left:4px solid #F28C28;padding-left:8px}
table.t th{border-bottom-color:#F28C28;color:#b45309}table.t tr.click:hover td{background:#fff3e6}
input:focus,select:focus,textarea:focus{outline:2px solid #F28C28;outline-offset:0;border-color:#F28C28}
.tabbar button.on{color:#F28C28}
@media (prefers-color-scheme:dark){table.t th{color:#ffb070}table.t tr.click:hover td{background:#3a2a1a}}
.login .btn.primary,:root[data-theme] .login .btn.primary,:root:not([data-theme="light"]) .login .btn.primary{background:var(--azul);border-color:var(--azul);color:#fff} /*login-azul*/
.btn.primary[onclick="editarTicket()"],#cNt{background:#fff;color:var(--azul);border-color:#fff}.btn.primary[onclick="editarTicket()"]:hover,#cNt:hover{background:#F28C28;border-color:#F28C28;color:#fff;filter:none}
.btn:not(.primary):not(.del):not(:disabled):hover{background:#F28C28;border-color:#F28C28;color:#fff}
</style>
