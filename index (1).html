<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · Terreno Seguro</title>
<meta name="theme-color" content="#0E1F45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0E1F45; overflow: hidden; font: 16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block;
           padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #0E1F45; }
  #carga { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
           background: #0E1F45; color: #C9CFE6; transition: opacity .4s; }
  .anillo { position: relative; width: 120px; height: 120px; } .anillo img { position: absolute; inset: 6px; width: 108px; height: 108px; border-radius: 50%; object-fit: contain; background: #fff; }
  #carga i { position: absolute; inset: 0; box-sizing: border-box; width: 120px; height: 120px; border: 4px solid rgba(255,255,255,.2); border-top-color: #1E9BFF; border-radius: 50%; animation: g 1s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  #elegir { position: fixed; inset: 0; z-index: 3; display: none; flex-direction: column; gap: 20px; align-items: center; justify-content: center; background: #0E1F45; }
  #elegir::before { content: ''; position: absolute; inset: 0 auto 0 0; width: min(58vw, 80vh); background: url(../fondo.jpg) center/cover no-repeat; -webkit-mask-image: linear-gradient(90deg, #000 65%, transparent); mask-image: linear-gradient(90deg, #000 65%, transparent); opacity: .9; }
  #elegir > * { position: relative; }
  @media (max-width: 700px) { #elegir::before { width: 100%; opacity: .35; } }
  #elegir img { width: min(260px, 70vw); filter: drop-shadow(0 4px 18px rgba(0,0,0,.45)); }
  #elegir form { background: #fff; color: #18203a; border-radius: 16px; padding: 22px; width: min(380px, 90vw); }
  #elegir input { width: 100%; box-sizing: border-box; font: inherit; font-size: 20px; padding: 11px; border: 1px solid #dde2ee; border-radius: 10px; margin: 8px 0 12px; }
  #elegir button { width: 100%; font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 13px; background: #1E9BFF; color: #fff; }
  #elegir p { color: #c62828; min-height: 20px; margin: 10px 0 0; font-weight: 600; }
</style>
</head>
<body>
<div id="carga"><div class="anillo"><img id="lg" src="icono-192.png" alt=""><i></i></div><span>Cargando…</span></div>
<div id="elegir"><img src="../logo.svg" alt="Terreno Seguro"><form id="fe"><b>Panel · código de la empresa</b><input id="ce" autocapitalize="none" autocomplete="off" placeholder="ej. clopez" required><button>Entrar</button><p id="me"></p></form></div>
<iframe title="Panel" allow="geolocation *; camera *; microphone *; clipboard-write *; fullscreen *"></iframe>
<script>
/* Panel único: panel/?c=CODIGO (o el último código usado en este computador). */
(function () {
  var q = new URLSearchParams(location.search), cod = (q.get('c') || '').toLowerCase().replace(/[^a-z0-9]/g, ''), guardado = null;
  try { guardado = JSON.parse(localStorage.getItem('ts_panel') || 'null'); } catch (e) {}
  if (!cod && guardado && !q.has('empresa')) cod = guardado.codigo;
  var frase = ['Ordenando los tickets…', 'Revisando la agenda…', 'Firmando papeles…', 'Seguridad primero, ya casi…'], n = 0;
  var t = setInterval(function () { var m = document.querySelector('#carga span'); if (!m) return clearInterval(t); m.textContent = frase[n++ % frase.length]; }, 2000);

  function pedir(msg) {
    document.getElementById('carga').style.display = 'none';
    document.getElementById('elegir').style.display = 'flex';
    document.getElementById('me').textContent = msg || '';
    document.getElementById('ce').focus();
  }
  document.getElementById('fe').onsubmit = function (ev) {
    ev.preventDefault();
    location.href = '?c=' + encodeURIComponent(document.getElementById('ce').value.trim().toLowerCase());
  };
  if (!cod) return pedir();

  fetch('../empresas.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (lista) {
    var e = lista[cod];
    if (!e || !e.url) return pedir('No encontramos el código "' + cod + '".');
    localStorage.setItem('ts_panel', JSON.stringify({ codigo: cod, url: e.url, nombre: e.nombre || cod }));
    document.title = 'Panel · ' + (e.nombre || cod);
    if (e.logo) document.getElementById('lg').src = (/^https?:|^data:/.test(e.logo) ? '' : '../') + e.logo;
    abrir(e.url);
  }).catch(function () {
    if (guardado && guardado.codigo === cod) abrir(guardado.url); else pedir('No se pudo cargar la lista de empresas.');
  });

  function abrir(u) {
    var f = document.querySelector('iframe'), src = u + '?p=admin';
    f.onload = function () { if (!f.src) return; var c = document.getElementById('carga'); if (c) { c.style.opacity = 0; setTimeout(function () { c.remove(); }, 450); } };
    // Panel nuevo publicado: el panel avisa y aquí se recarga solo.
    window.addEventListener('message', function (ev) { if (ev.data && ev.data.pvRecargar) f.src = u + '?p=admin&r=' + Date.now(); });
    var m = location.hash.match(/c=([A-Za-z0-9]+)/);
    if (m) { src += '&k=' + m[1]; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    // Precarga oculta: Google a veces falla en la primera carga; esto hace el "recargar" solo.
    var listo = false, w = document.createElement('iframe'); w.style.display = 'none';
    function ir() { if (listo) return; listo = true; f.src = src; setTimeout(function () { w.remove(); }, 3000); }
    w.onload = function () { setTimeout(ir, 300); }; setTimeout(ir, 8000);
    w.src = u + '?p=ping'; document.body.appendChild(w);
  }
})();
</script>
</body>
</html>
