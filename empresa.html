<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terreno Seguro · Elegir empresa</title>
<meta name="theme-color" content="#0E1F45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:#fff;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{min-height:100vh;background-color:#0E1F45;background-image:linear-gradient(180deg,rgba(9,22,52,.3) 0%,rgba(9,22,52,.68) 45%,rgba(9,22,52,.95) 100%),url(fondo.jpg);
       background-position:center,35% top;background-size:cover,cover;background-repeat:no-repeat;display:flex;align-items:flex-end}
  main{width:100%;max-width:440px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));text-align:center}
  .marca{width:min(260px,70vw);margin:0 auto 18px;display:block;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}
  form{background:rgba(255,255,255,.97);color:#18203a;border-radius:18px;padding:20px;text-align:left;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
  input{width:100%;font:inherit;font-size:20px;letter-spacing:.04em;padding:12px;border:1px solid #dde2ee;border-radius:10px;text-transform:lowercase}
  input:focus{outline:2px solid #1E9BFF;border-color:#1E9BFF}
  button{width:100%;margin-top:14px;font:inherit;font-weight:800;border:0;border-radius:10px;padding:14px;background:#1E9BFF;color:#fff;letter-spacing:.02em}
  button:disabled{opacity:.6}
  #msg{min-height:22px;margin-top:12px;font-weight:600;color:#c62828}
  .ayuda{font-size:13px;color:#667089;margin-top:10px}
  #actual{margin-top:16px;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6)}#actual a{color:#7cc4ff}
  @media (min-width:900px){
    body{align-items:center;background-image:none}
    body::before{content:"";position:fixed;inset:0 auto 0 0;width:min(58vw,80vh);background:url(fondo.jpg) center/cover no-repeat;
      -webkit-mask-image:linear-gradient(90deg,#000 65%,transparent);mask-image:linear-gradient(90deg,#000 65%,transparent)}
    main{position:relative;margin:0 8vw 0 auto}
  }
</style>
</head>
<body>
<main>
  <img class="marca" src="logo.svg" alt="Terreno Seguro · Prevención de riesgos">
  <form id="f">
    <label for="c">Código de tu empresa</label>
    <input id="c" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="ej. clopez" required>
    <button id="b">Continuar</button>
    <div id="msg"></div>
    <div class="ayuda">El código te lo da tu empresa (prevención o administración). Se pide una sola vez en este teléfono.</div>
  </form>
  <div id="actual"></div>
</main>
<script>
var f = document.getElementById('f'), inp = document.getElementById('c'), msg = document.getElementById('msg'), btn = document.getElementById('b');
var actual = null;
try { actual = JSON.parse(localStorage.getItem('ts_empresa') || 'null'); } catch (e) {}
if (actual && actual.marca) document.getElementById('actual').innerHTML = 'Empresa actual: <b>' + actual.marca.replace(/</g, '&lt;') + '</b> · <a href="./">volver</a>';
var q = new URLSearchParams(location.search).get('c');
if (q) { inp.value = q; setTimeout(function () { f.requestSubmit ? f.requestSubmit() : f.onsubmit(new Event('submit')); }, 50); }

f.onsubmit = function (ev) {
  if (ev && ev.preventDefault) ev.preventDefault();
  var cod = inp.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!cod) return;
  msg.textContent = ''; btn.disabled = true; btn.textContent = 'Buscando…';
  fetch('empresas.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (lista) {
    var e = lista[cod];
    if (!e || !e.url) throw new Error('No encontramos ese código. Revísalo con tu empresa.');
    var datos = { codigo: cod, url: e.url, marca: e.nombre || cod, logo: e.logo || '', colores: { primario: e.color || '', acento: e.acento || '' } };
    // Datos actualizados desde el sistema de la empresa (logo y colores de Configuración)
    return fetch(e.url + '?p=info').then(function (r) { return r.json(); }).then(function (i) {
      if (i && !i.alta) { datos.marca = i.marca || datos.marca; datos.logo = i.logo || datos.logo; datos.colores = i.colores || datos.colores; datos.vocab = i.vocab || {}; datos.apagados = i.apagados || []; }
      return datos;
    }).catch(function () { return datos; });
  }).then(function (datos) {
    if (actual && actual.codigo !== datos.codigo) {   // cambio de empresa: se borra la sesión y la cola de la anterior
      if (!confirm('Vas a cambiar de ' + (actual.marca || actual.codigo) + ' a ' + datos.marca + '.\n\nSi te quedan registros sin enviar de la empresa anterior, se pierden. ¿Continuar?')) throw new Error('Cambio cancelado.');
      Object.keys(localStorage).forEach(function (k) { if (/^(pv_|an_fondo)/.test(k)) localStorage.removeItem(k); });
      try { indexedDB.deleteDatabase('pv_cola'); } catch (e) {}
    }
    localStorage.setItem('ts_empresa', JSON.stringify(datos));
    location.replace('./');
  }).catch(function (e) {
    msg.textContent = navigator.onLine ? (e.message || 'No se pudo conectar.') : 'Sin señal: necesitas internet la primera vez.';
    btn.disabled = false; btn.textContent = 'Continuar';
  });
};
</script>
</body>
</html>
